name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --workspace
      - run: cargo test --workspace

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo doc --workspace --no-deps

  bindings-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build -p datastreamdb-node -p datastreamdb-py -p datastreamdb-ffi
      - run: gcc bindings/c/smoke.c -o /tmp/datastreamdb-c-smoke -I crates/datastreamdb-ffi -L target/debug -ldatastreamdb_ffi -lpthread -ldl -lm
      - run: LD_LIBRARY_PATH="$PWD/target/debug" /tmp/datastreamdb-c-smoke
