[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "datastreamdb"
version = "0.1.0"
description = "Python bindings for datastreamdb (embedded graph database)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "datastreamdb._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
